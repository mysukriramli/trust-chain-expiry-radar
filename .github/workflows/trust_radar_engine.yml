name: Trust Chain Expiry Radar Engine

on:
  schedule:
    - cron: '14 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trust-radar-compile
  cancel-in-progress: true

jobs:
  audit-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/trust_radar.db
          key: trust-radar-db-${{ github.run_id }}
          restore-keys: |
            trust-radar-db-

      - name: Execute Trust Chain Radar Engine
        run: python radar_engine.py

      - name: Commit Path Deltas and Certificate Graph
        run: |
          git config user.name "trust-bot[bot]"
          git config user.email "trust-bot@users.noreply.github.com"

          # Stage ledger, parquet, and public updates
          git add ledger/ data/certificate-graph.parquet public/

          if git diff --staged --quiet; then
            echo "No trust path transitions or expiry deltas detected."
          else
            git commit -m "chore(radar): record trust chain expirations and path proofs [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
